ze:.9rem;padding:7px;user-select:none}.cell.open{background:var(--accent);color:#fff}.cell.matched{background:rgba(53,201,149,.2);border-color:var(--ok);color:#8cf0c8;cursor:default}.option{display:block;width:100%;text-align:left;margin:7px 0;padding:10px 13px;border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--text);border-radius:10px;cursor:pointer;font-size:.95rem}.option.right{border-color:var(--ok);background:rgba(53,201,149,.13)}.option.wrong{border-color:var(--bad);background:rgba(255,107,120,.13)}.feedback{margin-top:9px;font-weight:600}.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}canvas{width:100%;max-width:600px;height:auto;background:rgba(0,0,0,.18);border-radius:12px;display:block}.slider{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}.slider span{min-width:90px}.slider input{flex:1}.result{margin-top:9px;font-size:.95rem;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;display:block;overflow-x:auto}th,td{padding:9px;border-bottom:1px solid var(--border);text-align:left;font-size:.92rem;white-space:nowrap}tr.me td{color:#b9b0ff;font-weight:700}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#eef1ff;color:#14182a;padding:11px 16px;border-radius:12px;font-size:.9rem;z-index:20;box-shadow:0 8px 30px #0006;max-width:calc(100% - 30px)}footer{text-align:center;color:var(--muted);font-size:.85rem;padding:22px 16px 30px}.empty{text-align:center;color:var(--muted);padding:28px 12px}@media(max-width:600px){header,main{width:min(100% - 22px,1040px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{border-radius:15px}.slider{align-items:stretch}.slider input{min-width:120px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}

<script>
/* Telegram Mini App initialization */
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  try {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#f4f0ff');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#f4f0ff');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    document.documentElement.style.setProperty('--tg-viewport-height', (tg.viewportHeight || window.innerHeight) + 'px');
    if (tg.onEvent) tg.onEvent('viewportChanged', function(){
      document.documentElement.style.setProperty('--tg-viewport-height', (tg.viewportHeight || window.innerHeight) + 'px');
    });
  } catch(e) { console.warn('Telegram WebApp init:', e); }
})();
</script>

function renderTopics() {
  let total = 0, checked = 0;
  Object.keys(SUBJECTS).forEach(s => SUBJECTS[s].forEach(b => b.topics.forEach(() => total++)));
  const validIds = new Set(allTopics().map(t => t.id));
  done.forEach(id => { if (validIds.has(id)) checked++; });
  const pct = total ? Math.round(checked / total * 100) : 0;
  const fill = h("div", { className: "progress-fill" });
  fill.style.width = pct + "%";
  app.append(h("div", { className: "card" },
    h("div", { className: "progress-bar" }, fill),
    h("div", { className: "muted", textContent: `Отмечено: ${checked} из ${total} (${pct}%)` }),
    h("button", { className: "btn ghost", textContent: "Сбросить отметки", onclick: () => {
      if (confirm("Сбросить все отметки?")) { done.clear(); saveDone(); renderAll(); }
    }})
  ));
  const search = h("input", { type: "search", placeholder: "Найти тему или правило…", style: "width:100%;margin:0 0 12px" });
  const subjectFilter = h("select", { style: "margin:0 0 12px;width:100%" },
    h("option", { value: "Все предметы", textContent: "Все предметы" }),
    ...Object.keys(SUBJECTS).map(s => h("option", { value: s, textContent: s })));
  const topicCards = h("div", {});
  function drawTopicCards() {
    topicCards.innerHTML = "";
    const term = search.value.trim().toLocaleLowerCase("ru");
    Object.keys(SUBJECTS).filter(subj => subjectFilter.value === "Все предметы" || subjectFilter.value === subj).forEach(subj => {
    const card = h("div", { className: "card" }, h("h2", { textContent: subj }));
    SUBJECTS[subj].forEach((block, bi) => {
      card.append(h("h3", { textContent: block.title, style: "font-size:1rem;margin:14px 0 4px" }));
      block.topics.forEach(([title, theory], ti) => {
        if (term && !(title + " " + theory).toLocaleLowerCase("ru").includes(term)) return;
        const id = `${subj}|${bi}|${ti}`;
        const cb = h("input", { type: "checkbox", checked: done.has(id), id });
        const row = h("div", { className: "topic" + (done.has(id) ? " done" : "") },
          h("div", { className: "topic-row" }, cb, h("label", { htmlFor: id, textContent: title })),
          h("details", {}, h("summary", { textContent: "Теория" }),
            h("div", { className: "theory", textContent: theory }))
        );
        cb.onchange = () => {
          const wasDone = done.has(id);
          cb.checked ? done.add(id) : done.delete(id);
          saveDone();
          if (cb.checked && !wasDone) gain(3, "topic");
          row.classList.toggle("done", cb.checked);
        };
        card.append(row);
      });
    });
    if (card.querySelector(".topic")) topicCards.append(card);
  });
    if (!topicCards.children.length) topicCards.append(h("div", { className: "card empty", textContent: "Ничего не найдено. Измените запрос или предмет." }));
  }
  search.oninput = drawTopicCards;
  subjectFilter.onchange = drawTopicCards;
  app.append(h("div", { className: "card" }, h("h2", { textContent: "Поиск по темам" }), search, subjectFilter), topicCards);
  drawTopicCards();
}

function renderPairs() {
  let cards = [];
  PAIRS.forEach(([name, f], i) => { cards.push({ id: i, text: name }); cards.push({ id: i, text: f }); });
  cards.sort(() => Math.random() - 0.5);
  let first = null, lock = false, matched = 0;
  const info = h("div", { className: "muted", textContent: "Соедините название формулы с самой формулой." });
  const grid = h("div", { className: "grid" });
  cards.forEach(c => {
    const el = h("div", { className: "cell", textContent: "?" });
    el.onclick = () => {
      if (lock || el.classList.contains("open") || el.classList.contains("matched")) return;
      el.classList.add("open"); el.textContent = c.text;
      if (!first) { first = { el, c }; return; }
      lock = true;
      if (first.c.id === c.id && first.c !== c) {
        first.el.classList.add("matched"); el.classList.add("matched");
        matched++; first = null; lock = false;
        gain(5, "pair");
        if (matched === PAIRS.length) info.textContent = "Все пары найдены!";
      } else {
        const a = first; first = null;
        setTimeout(() => {
          a.el.classList.remove("open"); a.el.textContent = "?";
          el.classList.remove("open"); el.textContent = "?";
          lock = false;
        }, 800);
      }
    };
    grid.append(el);
  });
  app.append(h("div", { className: "card" }, h("h2", { textContent: "Игра «Пары»: формулы" }), info, grid,
    h("button", { className: "btn", textContent: "Новая игра", style: "margin-top:12px", onclick: renderAll })));
}

// --- Интерактивный график ---
function renderGraph() {
  const sliders = [["a", -3, 3, 1, 0.1], ["b", -6, 6, 0, 0.5], ["c", -6, 6, -2, 0.5]];
  const vals = {};
  const canvas = h("canvas", { width: 600, height: 400 });
  const result = h("div", { className: "result" });
  const ctx = canvas.getContext("2d");

  function draw() {
    const { a, b, c } = vals;
    const W = 600, H = 400, S = 20;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "#8a93a6"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
    ctx.strokeStyle = "#3b6fd8"; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let px = 0; px <= W; px++) {
      const x = (px - W / 2) / S;
      const y = a * x * x + b * x + c;
      const py = H / 2 - y * S;
      px === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
    const D = b * b - 4 * a * c;
    let text = `f(x) = ${a}x² + ${b}x + ${c}. `;
    if (a !== 0) {
      text += `Вершина: x = ${(-b / (2 * a)).toFixed(2)}. `;
      if (D > 0) text += `Корни: ${((-b + Math.sqrt(D)) / (2 * a)).toFixed(2)} и ${((-b - Math.sqrt(D)) / (2 * a)).toFixed(2)}.`;
      else if (D === 0) text += `Один корень: x = ${(-b / (2 * a)).toFixed(2)}.`;
      else text += "Действительных корней нет.";
    } else {
      text += b !== 0 ? `Линейная функция, корень x = ${(-c / b).toFixed(2)}.` : "Константа.";
    }
    result.textContent = text;
  }

  const panel = h("div", {});
  sliders.forEach(([name, min, max, init, step]) => {
    vals[name] = init;
    const out = h("span", { textContent: `${name} = ${init}` });
    const inp = h("input", { type: "range", min, max, step, value: init });
    inp.oninput = () => { vals[name] = parseFloat(inp.value); out.textContent = `${name} = ${inp.value}`; draw(); };
    panel.append(h("div", { className: "slider" }, out, inp));
  });
  app.append(h("div", { className: "card" },
    h("h2", { textContent: "Интерактивный график квадратичной функции" }),
    h("p", { className: "muted", textContent: "Двигайте ползунки и смотрите, как меняется график, вершина и корни." }),
    canvas, panel, result));
  draw();
}

const PROFILE_KEY = "ege-profile";
const FRIENDS_KEY = "ege-friends";
const DAILY = [
  { id: "solved", text: "Решить 3 задачи (викторина или разбор)", need: 3 },
  { id: "topics", text: "Отметить 2 темы как изученные", need: 2 },
  { id: "steps", text: "Пройти 1 пошаговый разбор до конца", need: 1 }
];
const BADGES = {
  first: { name: "Первый шаг", desc: "Решите первое задание", test: p => p.solvedTotal >= 1 },
  first100: { name: "Первые 100 задач", desc: "Решите 100 заданий", test: p => p.solvedTotal >= 100 },
  master: { name: "Мастер функций", desc: "10 верных ответов по математике", test: p => (p.solvedBy["Математика"] || 0) >= 10 },
  owl: { name: "Ночной сова", desc: "Занимайтесь между 0:00 и 5:00", test: p => !!p.nightSession },
  week: { name: "Неделя подряд", desc: "Серия 7 дней", test: p => p.streak >= 7 }
};

function defaultProfile() {
  return { name: "Ученик", xp: 0, solvedTotal: 0, solvedBy: {}, streak: 0, lastDay: "",
           correctRun: 0, badges: [], nightSession: false,
           daily: { day: "", solved: 0, topics: 0, steps: 0, claimed: false } };
}
function loadProfile() {
  try { return Object.assign(defaultProfile(), JSON.parse(localStorage.getItem(PROFILE_KEY) || "{}")); }
  catch (e) { return defaultProfile(); }
}
let profile = loadProfile();
function saveProfile() { try { localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); } catch (e) {} }

function dayStr(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
}
function todayDaily() {
  return profile.daily.day === dayStr() ? profile.daily
    : { solved: 0, topics: 0, steps: 0, claimed: false };
}
function touchDay() {
  const t = dayStr();
  if (profile.daily.day !== t) profile.daily = { day: t, solved: 0, topics: 0, steps: 0, claimed: false };
  if (profile.lastDay !== t) {
    profile.streak = profile.lastDay === dayStr(-1) ? profile.streak + 1 : 1;
    profile.lastDay = t;
  }
  if (new Date().getHours() < 5) profile.nightSession = true;
}
function toast(msg) {
  const t = h("div", { className: "toast", textContent: msg });
  document.body.append(t);
  setTimeout(() => t.remove(), 2600);
}
function checkBadges() {
  Object.entries(BADGES).forEach(([id, b]) => {
    if (!profile.badges.includes(id) && b.test(profile)) {
      profile.badges.push(id);
      toast("🏅 Новый бейдж: " + b.name);
    }
  });
}
function checkDaily() {
  const d = profile.daily;
  if (!d.claimed && DAILY.every(t => d[t.id] >= t.need)) {
    d.claimed = true; profile.xp += 30;
    toast("Ежедневные задания выполнены! +30 XP");
  }
}
function commit() { checkBadges(); checkDaily(); saveProfile(); }

function gain(pts, reason) {
  touchDay();
  profile.xp += pts;
  if (reason === "topic") profile.daily.topics++;
  commit();
  toast(`+${pts} XP`);
}
function gainCorrect(subject, pts) {
  touchDay();
  profile.correctRun++;
  const bonus = profile.correctRun % 3 === 0 ? 15 : 0;
  profile.xp += pts + bonus;
  profile.solvedTotal++;
  profile.solvedBy[subject] = (profile.solvedBy[subject] || 0) + 1;
  profile.daily.solved++;
  bumpWeek();
  commit();
  toast(`+${pts + bonus} XP${bonus ? " (бонус за серию из 3!)" : ""}`);
}
function resetStreak() { profile.correctRun = 0; saveProfile(); }
function finishSteps() {
  touchDay();
  profile.xp += 20; profile.daily.steps++;
  commit();
  toast("+20 XP за разбор");
}
function subjOf(name) {
  return /Уравнение/.test(name) ? "Математика" : /Перевод/.test(name) ? "Информатика" : "Русский язык";
}

function encodeCode(obj) {
  return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(obj))));
}
function decodeCode(str) {
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(str.trim()), c => c.charCodeAt(0))));
}
function levelOf(xp) { return Math.floor(xp / 100) + 1; }

// --- Вкладка «Прогресс» ---
function renderProfile() {
  const into = profile.xp % 100;
  const fill = h("div", { className: "progress-fill" });
  fill.style.width = into + "%";
  const nameInput = h("input", { type: "text", value: profile.name, maxLength: 30 });
  nameInput.onchange = () => { profile.name = nameInput.value.trim() || "Ученик"; saveProfile(); };

      h("button", { className: "btn", textContent: "Скачать резервную копию", onclick: () => {
        const backup = { version: 1, exportedAt: new Date().toISOString(), done: [...done], profile, chatLog };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });

            done = new Set(data.done.filter(x => typeof x === "string"));
            profile = Object.assign(defaultProfile(), data.profile);
            profile.levels = profile.levels || {}; profile.srs = profile.srs || {}; profile.notes = profile.notes || {};
            profile.scores = profile.scores || []; profile.videos = profile.videos || {}; profile.badges = profile.badges || [];
            chatLog = Array.isArray(data.chatLog) ? data.chatLog.slice(-100) : [];

      )

// --- Вкладка «Рейтинг» ---
function renderBoard() {
  let friends = [];
  try { friends = JSON.parse(localStorage.getItem(FRIENDS_KEY) || "[]"); } catch (e) {}
  const me = { name: profile.name + " (вы)", xp: profile.xp, streak: profile.streak,
               solved: profile.solvedTotal, badges: profile.badges.length, me: true };
  const ta = h("textarea", { rows: 3, placeholder: "Вставьте код друга", style: "width:100%" });
  const status = h("div", { className: "muted" });

  const rows = [me, ...friends.map((f, i) => ({ ...f, idx: i }))].sort((a, b) => b.xp - a.xp);
  const table = h("table", {},
    h("tr", {}, ...["#", "Имя", "Уровень", "XP", "Серия", "Бейджи", ""].map(t => h("th", { textContent: t }))));
  rows.forEach((r, i) => {
    const del = r.me ? "" : "Удалить";
    const delBtn = r.me ? h("td") : h("td", {}, h("button", { className: "btn ghost", textContent: del,
      onclick: () => {
        friends.splice(r.idx, 1);
        localStorage.setItem(FRIENDS_KEY, JSON.stringify(friends));
        renderAll();
      } }));
    table.append(h("tr", { className: r.me ? "me" : "" },
      h("td", { textContent: i + 1 }), h("td", { textContent: r.name }),
      h("td", { textContent: levelOf(r.xp) }), h("td", { textContent: r.xp }),
      h("td", { textContent: r.streak }), h("td", { textContent: r.badges }), delBtn));
  });

  const addBtn = h("button", { className: "btn", textContent: "Добавить друга", onclick: () => {
    try {
      const f = decodeCode(ta.value);
      if (typeof f.n !== "string" || typeof f.x !== "number") throw new Error();
      friends.push({ name: f.n.slice(0, 30), xp: f.x, streak: f.s || 0, solved: f.t || 0, badges: f.b || 0 });
      localStorage.setItem(FRIENDS_KEY, JSON.stringify(friends));
      renderAll();
    } catch (e) { status.textContent = "Код не распознан. Проверьте, что скопировали его полностью."; }
  } });

  app.append(h("div", { className: "card" },
    h("h2", { textContent: "Рейтинг" }),
    h("p", { className: "muted", textContent: "Рейтинг хранится на вашем устройстве: друзья добавляются по коду, без регистрации." }),
    table),
    h("div", { className: "card" },
      h("h2", { textContent: "Добавить друга или одноклассника" }),
      ta, h("div", { style: "margin-top:8px" }, addBtn), status));
}

// ---------- ПЕРСОНАЛИЗАЦИЯ ----------
profile.levels = profile.levels || {};
profile.srs = profile.srs || {};
profile.avatar = profile.avatar || "🙂";
profile.theme = profile.theme || "Классика";
if (profile.testDone === undefined) profile.testDone = false;

const AVATARS = [["🙂", 0], ["🤓", 100], ["🧠", 300], ["🦉", 500], ["🚀", 800], ["🏆", 1200]];
const THEMES = [["Классика", "#3b6fd8", 0], ["Океан", "#0e7490", 200], ["Закат", "#e0703b", 400],
                ["Лес", "#2e8b57", 700], ["Ночь", "#7c5cff", 1000]];
const LEVEL_TEXT = ["Не знаю", "Частично", "Знаю"];

function dayNum() { return Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000); }
function allTopics() {
  const out = [];
  Object.keys(SUBJECTS).forEach(s => SUBJECTS[s].forEach((b, bi) => b.topics.forEach(([t, th], ti) =>
    out.push({ id: `${s}|${bi}|${ti}`, subj: s, title: t, theory: th }))));
  return out;
}
function applyTheme() {
  const th = THEMES.find(t => t[0] === profile.theme) || THEMES[0];
  document.documentElement.style.setProperty("--accent", th[1]);
}
function applyAvatar() {
  document.querySelector("h1").textContent = profile.avatar + " Подготовка к ЕГЭ";
}
function questionEl(item, subj) {
  const box = h("div", { className: "card", style: "margin:8px 0" }, h("p", { textContent: item.q, style: "font-weight:600" }));
  const fb = h("div", { className: "feedback" });
  item.o.forEach((text, i) => {
    const b = h("button", { className: "option", textContent: text });
    b.onclick = () => {
      box.querySelectorAll(".option").forEach(x => x.disabled = true);
      if (i === item.a) { b.classList.add("right"); fb.className = "feedback ok"; fb.textContent = "Верно! " + item.e; gainCorrect(subj, 10); }
      else {
        b.classList.add("wrong"); box.querySelectorAll(".option")[item.a].classList.add("right");
        fb.className = "feedback bad"; fb.textContent = "Неверно. " + item.e; resetStreak();
      }
    };
    box.append(b);
  });
  box.append(fb);
  return box;
}

// --- Стартовый тест ---
function renderTest() {
  const topics = allTopics();
  const answers = {};
  const status = h("div", { className: "muted" });
  const card = h("div", { className: "card" },
    h("h2", { textContent: "Стартовый тест" }),
    h("p", { className: "muted", textContent: "Отметьте, насколько уверенно вы знаете каждую тему. По ответам составим слабые места и план." }));
  let curSubj = "";
  topics.forEach(t => {
    if (t.subj !== curSubj) { curSubj = t.subj; card.append(h("h3", { textContent: curSubj, style: "font-size:1rem;margin-top:14px" })); }
    const btns = h("div", { style: "margin-top:4px" });
    [0, 1, 2].forEach(lv => {
      const b = h("button", { className: "btn ghost", textContent: LEVEL_TEXT[lv], style: "margin-right:6px;font-size:0.85rem" });
      b.onclick = () => {
        answers[t.id] = lv;
        btns.querySelectorAll("button").forEach(x => x.style.background = "");
        b.style.background = "var(--border)";
      };
      btns.append(b);
    });
    card.append(h("div", { className: "topic" }, h("div", { textContent: t.title }), btns));
  });
  card.append(h("button", { className: "btn", textContent: "Построить план", style: "margin-top:14px", onclick: () => {
    const missing = topics.length - Object.keys(answers).length;
    if (missing > 0) { status.textContent = `Ответьте ещё на ${missing} тем.`; return; }
    profile.levels = answers;
    profile.testDone = true;
    topics.forEach(t => { profile.srs[t.id] = { ivl: 1, due: dayNum() + (answers[t.id] === 0 ? 0 : answers[t.id] === 1 ? 1 : 3) }; });
    profile.xp += 20;
    commit();
    toast("Тест пройден! +20 XP");
    currentTab = "plan";
    renderAll();
  } }), status);
  app.append(card);
}

// --- Мой план: план, повторение, тренировка ---
function review(id, remembered) {
  const s = profile.srs[id] || { ivl: 1 };
  s.ivl = remembered ? Math.min(s.ivl * 2, 30) : 1;
  s.due = dayNum() + s.ivl;
  profile.srs[id] = s;
  if (remembered) gain(5, "review"); else saveProfile();
  renderAll();
}
function renderPlan() {
  if (!profile.testDone) return renderTest();
  const topics = allTopics();
  const weak = topics.filter(t => profile.levels[t.id] !== undefined && profile.levels[t.id] < 2)
                     .sort((a, b) => profile.levels[a.id] - profile.levels[b.id]);
  const due = topics.filter(t => profile.srs[t.id] && profile.srs[t.id].due <= dayNum())
                    .sort((a, b) => profile.levels[a.id] - profile.levels[b.id]);

  const planCard = h("div", { className: "card" }, h("h2", { textContent: "Индивидуальный план на 7 дней" }));
  if (!weak.length) planCard.append(h("p", { className: "muted", textContent: "Слабых тем нет. Отличная работа!" }));
  for (let d = 0; d < 7; d++) {
    const chunk = weak.slice(d * 3, d * 3 + 3);
    if (!chunk.length) break;
    planCard.append(h("div", { style: "margin:6px 0" },
      h("b", { textContent: `День ${d + 1}: ` }), h("span", { textContent: chunk.map(t => t.title).join("; ") })));
  }
  planCard.append(h("button", { className: "btn ghost", textContent: "Пройти тест заново", onclick: () => {
    profile.testDone = false; saveProfile(); renderAll();
  } }));

  const reviewCard = h("div", { className: "card" },
    h("h2", { textContent: "Интервальное повторение" }),
    h("p", { className: "muted", textContent: due.length ? `Сегодня к повторению: ${due.length} тем.` : "Сегодня повторять нечего." }),
    h("button", { className: "btn ghost", textContent: "Включить напоминания", onclick: async () => {
      try {
        const p = await Notification.requestPermission();
        toast(p === "granted" ? "Напоминания включены" : "Разрешение не выдано");
      } catch (e) { toast("Браузер не поддерживает уведомления"); }
    } }));
  due.forEach(t => reviewCard.append(h("div", { className: "topic" },
    h("div", { textContent: t.title }),
    h("details", {}, h("summary", { textContent: "Теория" }), h("div", { className: "theory", textContent: t.theory })),
    h("div", { style: "margin-top:6px" },
      h("button", { className: "btn", textContent: "Вспомнил", onclick: () => review(t.id, true) }), " ",
      h("button", { className: "btn ghost", textContent: "Не вспомнил", onclick: () => review(t.id, false) })))));

  const trainCard = h("div", { className: "card" }, h("h2", { textContent: "Тренировка по слабым местам" }));
  if (!weak.length) trainCard.append(h("p", { className: "muted", textContent: "Слабых мест нет." }));
  weak.forEach(t => trainCard.append(h("div", { className: "topic" },
    h("div", { textContent: `${t.title} (${LEVEL_TEXT[profile.levels[t.id]]})` }),
    h("div", { className: "theory", textContent: t.theory }))));
  [...new Set(weak.map(t => t.subj))].forEach(s => {
    trainCard.append(h("h3", { textContent: s, style: "font-size:1rem;margin-top:12px" }));
    (QUIZ[s] || []).forEach(item => trainCard.append(questionEl(item, s)));
  });

  app.append(planCard, reviewCard, trainCard);

  if ("Notification" in window && Notification.permission === "granted" && due.length) {
    try { new Notification("Пора повторить темы ЕГЭ", { body: `Тем к повторению: ${due.length}` }); } catch (e) {}
  }
}

// --- Мотивация ---
function renderMotiv() {
  const days = Math.max(0, Math.ceil((new Date(profile.examDate + "T00:00:00") - Date.now()) / 86400000));
  const toRu = iso => { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; };
  const field = h("input", { type: "text", value: toRu(profile.examDate), placeholder: "ДД.ММ.ГГГГ", style: "width:140px" });
  const saveDate = () => {
    const m = field.value.trim().match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
    if (!m) return toast("Введите дату в формате ДД.ММ.ГГГГ");
    const d = new Date(+m[3], +m[2] - 1, +m[1]);
    if (d.getDate() !== +m[1] || d.getMonth() !== +m[2] - 1) return toast("Такой даты не существует");
    profile.examDate = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
    saveProfile(); toast("Дата экзамена сохранена"); renderAll();
  };
  field.onkeydown = e => { if (e.key === "Enter") saveDate(); };
  const examInput = h("div", {}, field, " ", h("button", { className: "btn", textContent: "Сохранить", onclick: saveDate }));

  const wkCount = dayNum() - profile.week.start >= 7 ? 0 : profile.week.count;
  const wkFill = h("div", { className: "progress-fill" });
  wkFill.style.width = Math.min(100, wkCount / 27 * 100) + "%";

  const topics = allTopics();
  const mSel = h("select", {}, ...topics.map(t => h("option", { value: t.id, textContent: t.title })));
  const marBox = h("div", {});
  if (profile.marathon) {
    const m = profile.marathon;
    const topic = topics.find(x => x.id === m.id);
    const k = m.days.length;
    marBox.append(h("p", { className: "muted", textContent: `Тема: ${topic ? topic.title : "—"}. Выполнено дней: ${k} из 7` }));
    if (k < 7) {
      marBox.append(h("p", { textContent: `День ${k + 1}: ${MARATHON_STEPS[k]}` }),
        h("button", { className: "btn", textContent: "День выполнен", onclick: () => {
          profile.marathon.days.push(k + 1);
          profile.xp += 10;
          if (profile.marathon.days.length === 7) { profile.xp += 50; toast("Марафон завершён! +50 XP"); }
          else toast("+10 XP");
          commit(); renderAll();
        } }));
    } else {
      marBox.append(h("p", { className: "feedback ok", textContent: "Марафон пройден!" }));
    }
    marBox.append(h("button", { className: "btn ghost", textContent: "Новый марафон", style: "margin-top:8px", onclick: () => {
      profile.marathon = null; saveProfile(); renderAll();
    } }));
  } else {
    marBox.append(h("p", { className: "muted", textContent: "Выберите тему и пройдите её за 7 дней: по одному шагу в день." }),
      mSel,
      h("div", { style: "margin-top:8px" }, h("button", { className: "btn", textContent: "Начать марафон", onclick: () => {
        profile.marathon = { id: mSel.value, days: [] }; saveProfile(); renderAll();
      } })));
  }

  app.append(
    h("div", { className: "card", style: "text-align:center" },
      h("h2", { textContent: "До экзамена" }),
      h("div", { style: "font-size:2.4rem;font-weight:700;color:var(--accent)", textContent: `${days} дн.` }),
      h("p", { className: "muted", textContent: "Дата ЕГЭ:" }), examInput,
      h("p", { style: "margin-top:12px;font-style:italic", textContent: QUOTES[dayNum() % QUOTES.length] })),
    h("div", { className: "card" }, h("h2", { textContent: "Истории выпускников" }),
      ...STORIES.map(s => h("div", { className: "topic", textContent: s }))),
    h("div", { className: "card" }, h("h2", { textContent: "Челлендж «27 задач за неделю»" }),
      h("div", { className: "progress-bar" }, wkFill),
      h("div", { className: "muted", textContent: `Решено: ${wkCount} из 27. Награда: +50 XP` })),
    h("div", { className: "card" }, h("h2", { textContent: "Марафон по одной теме" }), marBox)
  );
}

// --- Разборы и чат ---
function safeWebUrl(value) {
  try { const u = new URL(value); return ["http:", "https:"].includes(u.protocol) ? u.href : ""; }
  catch (e) { return ""; }
}
function renderNotes() {
  const topics = allTopics();
  const sel = h("select", {}, ...topics.map(t => h("option", { value: t.id, textContent: t.title })));
  const ta = h("textarea", { rows: 5, style: "width:100%", placeholder: "Условие, ход решения, где ошиблись" });
  ta.value = profile.notes[sel.value] || "";
  sel.onchange = () => { ta.value = profile.notes[sel.value] || ""; };

  const saved = topics.filter(t => profile.notes[t.id]);
  const list = h("div", {}, ...saved.map(t => h("details", { style: "margin-top:6px" },
    h("summary", { textContent: t.title }),
    h("div", { className: "theory", textContent: profile.notes[t.id] }))));

  const linkInput = h("input", { type: "url", value: profile.chatLink, placeholder: "https://… ссылка на чат группы", style: "width:100%" });

  app.append(
    h("div", { className: "card" }, h("h2", { textContent: "Мои разборы" }),
      h("p", { className: "muted", textContent: "Записывайте разбор задач и ошибок. Разборы хранятся на вашем устройстве." }),
      sel, ta,
      h("div", { style: "margin-top:8px" },
        h("button", { className: "btn", textContent: "Сохранить разбор", onclick: () => {
          profile.notes[sel.value] = ta.value.trim(); saveProfile(); toast("Разбор сохранён"); renderAll();
        } }), " ",
        h("button", { className: "btn ghost", textContent: "Скачать все (.txt)", onclick: () => {
          if (!saved.length) return toast("Разборов пока нет");
          const text = saved.map(t => `${t.subj} — ${t.title}\n${profile.notes[t.id]}\n`).join("\n");
          const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" })), download: "ege-razbory.txt" });
          document.body.append(a); a.click(); a.remove();
        } })),
      list),
    h("div", { className: "card" }, h("h2", { textContent: "Чат с наставниками и одноклассниками" }),
      h("p", { className: "muted", textContent: "Сайт не хранит сообщения. Создайте чат в Telegram или VK, вставьте ссылку сюда и отправляйте туда свои разборы." }),
      linkInput,
      h("div", { style: "margin-top:8px" },
        h("button", { className: "btn", textContent: "Сохранить ссылку", onclick: () => {
          const safe = safeWebUrl(linkInput.value.trim());
        if (linkInput.value.trim() && !safe) return toast("Укажите корректную ссылку, начинающуюся с https:// или http://");
        profile.chatLink = safe; saveProfile(); renderAll();
        } }), " ",
        profile.chatLink ? h("a", { href: profile.chatLink, target: "_blank", rel: "noopener", className: "btn ghost", textContent: "Открыть чат" }) : "")
    )
  );
}

// ---------- ЧАТ И БОТ-НАСТАВНИК ----------
const CHAT_KEY = "ege-chat";
let chatLog = [];
try { chatLog = JSON.parse(localStorage.getItem(CHAT_KEY) || "[]"); } catch (e) {}
function saveChat() { try { localStorage.setItem(CHAT_KEY, JSON.stringify(chatLog.slice(-100))); } catch (e) {} }

const ENCOURAGE = [
  "Усталость — это нормально. Сделайте короткий перерыв и вернитесь к одной задаче.",
  "Вы уже прошли путь, который многие откладывают. Продолжайте!",
  "Маленький шаг сегодня лучше идеального плана, который так и не начат.",
  "Ошибка — это подсказка, какую тему повторить. Значит, вы учитесь."
];
const ADVICE = [
  "Решайте задачи каждый день, даже по одной. Регулярность важнее длинных марафонов.",
  "Сначала закройте слабые темы из вкладки «Мой план», потом тренируйте скорость.",
  "Разбирайте каждую ошибку и записывайте её во вкладку «Разборы».",
  "Чередуйте предметы: математика, информатика и русский лучше работают вместе."
];

function daysToExam() {
  return Math.max(0, Math.ceil((new Date(profile.examDate + "T00:00:00") - Date.now()) / 86400000));
}
function botReply(msg) {
  const t = msg.toLowerCase();
  const dueCount = allTopics().filter(x => profile.srs[x.id] && profile.srs[x.id].due <= dayNum()).length;
  const pick = arr => arr[dayNum() % arr.length];
  if (/привет|здрав|добр|hello|hi/.test(t))
    return "Здравствуйте! Я бот-наставник. Напишите «устал», «прогресс», «план» или «совет», и я отвечу.";
  if (/устал|не могу|трудно|сложно|надоел|бросить|страшно/.test(t))
    return pick(ENCOURAGE) + " Предлагаю 15 минут: одна тема или три задачи.";
  if (/прогресс|статист|сколько|как я|уровень/.test(t))
    return `Уровень ${levelOf(profile.xp)}, ${profile.xp} XP, серия ${profile.streak} дн., решено заданий: ${profile.solvedTotal}. До экзамена ${daysToExam()} дн.`;
  if (/план|что делать|сегодня|повтор/.test(t))
    return dueCount
      ? `Сегодня к повторению ${dueCount} тем. Начните с вкладки «Мой план».`
      : "На сегодня повторять нечего. Можно решить несколько задач для тренировки.";
  if (/совет|как готов|с чего начать|начать/.test(t)) return pick(ADVICE);
  return "Понял вас. " + pick(ENCOURAGE);
}

function renderChat() {
  if (!chatLog.length)
    chatLog.push({ from: "bot", text: "Привет! Я бот-наставник. Напишите «устал», «прогресс», «план» или «совет»." });
  const list = h("div", { style: "max-height:420px;overflow-y:auto;padding:8px 0" });
  const draw = () => {
    list.innerHTML = "";
    chatLog.forEach(m => {
      const mine = m.from === "me";
      list.append(h("div", { style: `margin:6px 0;text-align:${mine ? "right" : "left"}` },
        h("span", { style: `display:inline-block;max-width:80%;padding:8px 12px;border-radius:12px;border:1px solid var(--border);` +
          `background:${mine ? "var(--accent)" : "var(--bg)"};color:${mine ? "#fff" : "var(--text)"}`, textContent: m.text })));
    });
    list.scrollTop = list.scrollHeight;
  };
  const input = h("input", { type: "text", placeholder: "Напишите сообщение", style: "flex:1" });
  const send = () => {
    const text = input.value.trim();
    if (!text) return;
    chatLog.push({ from: "me", text });
    input.value = "";
    draw(); saveChat();
    setTimeout(() => { chatLog.push({ from: "bot", text: botReply(text) }); saveChat(); draw(); }, 500);
  };
  input.onkeydown = e => { if (e.key === "Enter") send(); };
  draw();
  app.append(h("div", { className: "card" },
    h("h2", { textContent: "Чат с наставником" }),
    h("p", { className: "muted", textContent: "Бот отвечает сразу и знает ваш прогресс. Живые наставники общаются в группе: ссылка на вкладке «Разборы»." }),
    list,
    h("div", { style: "display:flex;gap:8px;margin-top:8px" }, input, h("button", { className: "btn", textContent: "Отправить", onclick: send })),
    h("button", { className: "btn ghost", textContent: "Очистить чат", style: "margin-top:8px", onclick: () => {
      chatLog = []; saveChat(); renderAll();
    } })));
}

// ---------- ПОЛЕЗНЫЕ ДОПОЛНЕНИЯ ----------
profile.scores = profile.scores || [];
profile.videos = profile.videos || {};
let examTimer = null;
const pad = n => String(n).padStart(2, "0");

// --- Тренажёр с таймером ---
function renderExam() {
  const subjSel = h("select", {}, ...Object.keys(QUIZ).map(s => h("option", { value: s, textContent: s })));
  const durSel = h("select", {},
    h("option", { value: 10, textContent: "Демо: 10 минут" }),
    h("option", { value: 235, textContent: "Профильная математика: 3 ч 55 мин" }),
    h("option", { value: 210, textContent: "Русский язык или информатика: 3 ч 30 мин" }));
  const area = h("div", {});

  const start = () => {
    const subj = subjSel.value, items = QUIZ[subj], mins = +durSel.value;
    const ans = {};
    let finished = false;
    const endAt = Date.now() + mins * 60000;
    area.innerHTML = "";
    const clock = h("div", { className: "result", style: "font-size:1.3rem;font-weight:700" });
    area.append(clock);

    const finish = () => {
      if (finished) return;
      finished = true;
      clearInterval(examTimer); examTimer = null;
      const ok = items.filter((it, i) => ans[i] === it.a).length;
      const pct = Math.round(ok / items.length * 100);
      profile.scores.push({ d: dayStr(), subj, pct });
      saveProfile();
      area.innerHTML = "";
      area.append(h("div", { className: "feedback ok", textContent: `Результат: ${ok} из ${items.length} (${pct}%)` }));
      items.forEach((it, i) => {
        const right = ans[i] === it.a;
        area.append(h("div", { className: "topic" },
          h("div", { className: right ? "feedback ok" : "feedback bad", textContent: `${right ? "Верно" : "Неверно"}: ${it.q}` }),
          h("div", { className: "muted", textContent: it.e })));
      });
      area.append(h("button", { className: "btn", textContent: "Пройти ещё раз", style: "margin-top:10px", onclick: () => renderAll() }));
    };

    items.forEach((it, i) => {
      const box = h("div", { className: "topic" }, h("p", { textContent: `${i + 1}. ${it.q}`, style: "font-weight:600" }));
      it.o.forEach((text, j) => {
        const b = h("button", { className: "option", textContent: text });
        b.onclick = () => {
          ans[i] = j;
          box.querySelectorAll(".option").forEach(x => x.style.background = "");
          b.style.background = "var(--border)";
        };
        box.append(b);
      });
      area.append(box);
    });
    area.append(h("button", { className: "btn", textContent: "Завершить и проверить", style: "margin-top:12px", onclick: finish }));

    const tick = () => {
      const left = Math.max(0, endAt - Date.now());
      const s = Math.floor(left / 1000);
      clock.textContent = `Осталось: ${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`;
      if (left <= 0) finish();
    };
    clearInterval(examTimer);
    examTimer = setInterval(tick, 1000);
    tick();
  };

  app.append(h("div", { className: "card" },
    h("h2", { textContent: "Тренажёр в формате экзамена" }),
    h("p", { className: "muted", textContent: "Все вопросы на одном экране, без подсказок. Ответы проверяются в конце. Длительность проверьте на fipi.ru. Если уйти с вкладки, таймер остановится." }),
    h("div", { className: "slider" }, subjSel, durSel),
    h("button", { className: "btn", textContent: "Начать", onclick: start }),
    area));
}

const EXPLAIN = [

function renderMistakes() {
  const card = h("div", { className: "card" }, h("h2", { textContent: "Типичные ошибки" }));
  MISTAKES.forEach(m => card.append(h("div", { className: "topic" },
    h("div", { className: "muted", textContent: m.subj }),
    h("div", { style: "font-weight:600", textContent: m.title }),
    h("div", { textContent: "Почему это случается: " + m.why }),
    h("div", { className: "theory", textContent: "Как не ошибаться: " + m.rule }))));

  const vcard = h("div", { className: "card" }, h("h2", { textContent: "Сложные темы: объяснения и видео" }),
    h("p", { className: "muted", textContent: "Вставьте ссылку на своё видео или разбор. Сайт сам видео не подбирает." }));
  EXPLAIN.forEach(([key, title, text]) => {
    const link = h("input", { type: "url", value: profile.videos[key] || "", placeholder: "https://… ссылка на видео (необязательно)", style: "width:100%" });

      const safe = safeWebUrl(link.value.trim());

        style: "display:inline-block;margin-top:6px", textContent: "Открыть видео" }) : ""));

}

// --- Дашборд роста результатов ---
function renderDash() {
  const colors = { "Математика": "#3b6fd8", "Информатика": "#2e9d6a", "Русский язык": "#e0703b" };
  const W = 600, H = 220, P = 30;
  const scores = profile.scores;
  let lines = "";
  Object.keys(colors).forEach(s => {
    const arr = scores.filter(x => x.subj === s);
    if (!arr.length) return;
    const n = arr.length;
    const xy = arr.map((x, i) => {
      const px = n === 1 ? W / 2 : P + i * (W - 2 * P) / (n - 1);
      const py = H - P - x.pct / 100 * (H - 2 * P);
      return [px, py];
    });
    lines += `<polyline points="${xy.map(p => p.join(",")).join(" ")}" fill="none" stroke="${colors[s]}" stroke-width="2.5"/>`;
    xy.forEach(p => lines += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${colors[s]}"/>`);
  });
  const chart = h("div", {});
  chart.innerHTML = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:600px;background:var(--bg);border-radius:8px">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="#8a93a6"/>
    <line x1="${P}" y1="${P}" x2="${P}" y2="${H - P}" stroke="#8a93a6"/>
    <text x="2" y="${P + 4}" font-size="11" fill="#8a93a6">100</text>
    <text x="2" y="${H - P}" font-size="11" fill="#8a93a6">0</text>${lines}</svg>`;

  const legend = h("div", { className: "muted" }, ...Object.keys(colors).map(s =>
    h("span", { style: `color:${colors[s]};margin-right:14px`, textContent: "● " + s })));

  const stats = h("div", {}, ...Object.keys(colors).map(s => {
    const arr = scores.filter(x => x.subj === s);
    if (!arr.length) return h("div", { className: "topic muted", textContent: `${s}: результатов пока нет` });
    const avg = Math.round(arr.reduce((a, x) => a + x.pct, 0) / arr.length);
    const last = arr[arr.length - 1].pct;
    return h("div", { className: "topic", textContent: `${s}: попыток ${arr.length}, среднее ${avg}, последнее ${last}` });
  }));

  const manualSubj = h("select", {}, ...Object.keys(colors).map(s => h("option", { value: s, textContent: s })));
  const manualVal = h("input", { type: "number", min: 0, max: 100, value: 70, style: "width:90px" });
  const status = h("div", { className: "muted" });

  app.append(
    h("div", { className: "card" }, h("h2", { textContent: "Рост результатов" }),
      h("p", { className: "muted", textContent: "Здесь видны результаты тренажёра (в процентах) и пробников, которые вы введёте сами (по вашей шкале 0–100)." }),
      chart, legend, stats),
    h("div", { className: "card" }, h("h2", { textContent: "Добавить результат пробника" }),
      h("div", { className: "slider" }, manualSubj, manualVal),
      h("button", { className: "btn", textContent: "Добавить", onclick: () => {
        const v = +manualVal.value;
        if (!(v >= 0 && v <= 100)) { status.textContent = "Введите число от 0 до 100."; return; }
        profile.scores.push({ d: dayStr(), subj: manualSubj.value, pct: v, manual: true });
        saveProfile(); renderAll();
      } }), status));
}

applyTheme();
applyAvatar();
if (!profile.testDone) currentTab = "plan";
